<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KikeFight - La Baronesa del Mueble</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <h1>KIKEFIGHT: LA BARONESA DEL MUEBLE</h1>
      <p class="hint">Estética pixel retro · Boss que vuela y tira muebles.</p>
      <canvas id="game" width="1280" height="720"></canvas>
      <section class="controls">
        <h2>Controles</h2>
        <p>A / D: mover · W: saltar · J: ataque · K: ataque pesado · Enter: iniciar/reintentar</p>
        <p class="assets-note">Assets opcionales: <code>web/assets/scene_ref.png</code>, <code>web/assets/kike_poses.png</code>, <code>web/assets/baronesa.png</code>.</p>
      </section>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
